<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patela — Messages</title>
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="messages" data-breadcrumb="Messages">
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>

      <main class="main-content" id="messages-page-root">
        <section class="welcome-header">
          <div>
            <h1 class="page-title">Messages</h1>
            <p class="page-subtitle">Direct communication for active projects.</p>
          </div>
        </section>

        <div class="workspace-grid" style="grid-template-columns:1fr 1.8fr;">
          <section class="card-flush" aria-label="Conversation Threads">
            <div class="action-list" id="msg-threads-list"></div>
          </section>

          <section class="card" aria-label="Active Conversation">
            <div class="card-header" id="msg-chat-header"></div>
            <div id="msg-chat-body" style="min-height:240px;max-height:380px;overflow-y:auto;padding:8px 0;"></div>
            <form id="msg-send-form" class="card-footer" style="margin-top:12px;">
              <input type="text" id="msg-text-input" class="input" style="flex:1;" placeholder="Write a message…" required />
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
