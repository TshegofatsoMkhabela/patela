AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Patela web app on AWS Amplify Hosting (Next.js SSR). Creates the Amplify app
  connected to GitHub, a main branch that redeploys on every push, and a frozen
  demo branch that only changes when it is released on purpose.

Parameters:
  RepositoryUrl:
    Type: String
    Default: https://github.com/TshegofatsoMkhabela/patela
    Description: GitHub repository Amplify builds from.
  BranchName:
    Type: String
    Default: main
    Description: Development branch; every push to it is built and deployed.
  DemoBranchName:
    Type: String
    Default: demo
    Description: >
      Branch shown on stage. Auto-build is off, so pushes to it are not
      deployed until someone runs a release (aws amplify start-job).
  GitHubTokenSecretName:
    Type: String
    Default: patela/github-token
    Description: >
      Secrets Manager secret holding a GitHub token (plain string) with repo
      access. Amplify uses it once to add the deploy webhook to the repo.
  WebChainId:
    Type: String
    Default: "11142220"
    AllowedValues: ["11142220", "42220"]
  ZarmAddress:
    Type: String
    Default: "0x10CCfB235b0E1Ed394bACE4560C3ed016697687e"
    AllowedPattern: "^0x[0-9a-fA-F]{40}$"
  EscrowAddress:
    Type: String
    Default: "0x0000000000000000000000000000000000000000"
    AllowedPattern: "^0x[0-9a-fA-F]{40}$"
  WebRpcUrl:
    Type: String
    Default: "https://forno.celo-sepolia.celo-testnet.org"
  ApiOrigin:
    Type: String
    Default: ""

Resources:
  PatelaApp:
    Type: AWS::Amplify::App
    Properties:
      Name: patela
      Description: Patela - money follows proof
      Repository: !Ref RepositoryUrl
      # Read at deploy time; never stored in this file or in the stack outputs.
      AccessToken: !Sub "{{resolve:secretsmanager:${GitHubTokenSecretName}}}"
      # WEB_COMPUTE is required for Next.js server-side rendering (Next 12+).
      Platform: WEB_COMPUTE
      EnableBranchAutoDeletion: false
      # A failing test or build stops the deploy; the last good version stays live.
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - nvm use 20
                - npm ci
            build:
              commands:
                - npm test
                - npm run build
          artifacts:
            baseDirectory: .next
            files:
              - '**/*'
          cache:
            paths:
              - node_modules/**/*
              - .next/cache/**/*
      Tags:
        - Key: project
          Value: patela

  MainBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt PatelaApp.AppId
      BranchName: !Ref BranchName
      Framework: Next.js - SSR
      Stage: DEVELOPMENT
      EnableAutoBuild: true
      # Set on the branch, not the app: the URL only exists once the app does.
      EnvironmentVariables:
        - Name: NEXT_PUBLIC_SITE_URL
          Value: !Sub "https://${BranchName}.${PatelaApp.DefaultDomain}"
        - Name: NEXT_PUBLIC_CHAIN_ID
          Value: !Ref WebChainId
        - Name: NEXT_PUBLIC_ZARM_ADDRESS
          Value: !Ref ZarmAddress
        - Name: NEXT_PUBLIC_ESCROW_ADDRESS
          Value: !Ref EscrowAddress
        - Name: NEXT_PUBLIC_RPC_URL
          Value: !Ref WebRpcUrl
        - Name: NEXT_PUBLIC_API_BASE_URL
          Value: !Ref ApiOrigin
      Tags:
        - Key: project
          Value: patela

  DemoBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt PatelaApp.AppId
      BranchName: !Ref DemoBranchName
      Framework: Next.js - SSR
      Stage: PRODUCTION
      # Frozen: a push to the demo branch never changes what's on stage by itself.
      EnableAutoBuild: false
      EnvironmentVariables:
        - Name: NEXT_PUBLIC_SITE_URL
          Value: !Sub "https://${DemoBranchName}.${PatelaApp.DefaultDomain}"
        - Name: NEXT_PUBLIC_CHAIN_ID
          Value: !Ref WebChainId
        - Name: NEXT_PUBLIC_ZARM_ADDRESS
          Value: !Ref ZarmAddress
        - Name: NEXT_PUBLIC_ESCROW_ADDRESS
          Value: !Ref EscrowAddress
        - Name: NEXT_PUBLIC_RPC_URL
          Value: !Ref WebRpcUrl
        - Name: NEXT_PUBLIC_API_BASE_URL
          Value: !Ref ApiOrigin
      Tags:
        - Key: project
          Value: patela

Outputs:
  AppId:
    Description: Amplify app ID, used by the aws amplify CLI commands.
    Value: !GetAtt PatelaApp.AppId
  SiteUrl:
    Description: Development URL; updates on every push to the main branch.
    Value: !Sub "https://${BranchName}.${PatelaApp.DefaultDomain}"
  DemoUrl:
    Description: Stage URL; changes only when the demo branch is released.
    Value: !Sub "https://${DemoBranchName}.${PatelaApp.DefaultDomain}"
